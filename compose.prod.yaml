# Produksi di vm-gpu. Pola: dev-ops/home-server/traefik.md bagian 4.
# Tanpa port yang dipublikasikan — trafik masuk lewat tunnel vm-gpu ke Traefik
# di network `edge`. Jalankan selalu dengan --env-file .env.prod.
services:
  web:
    image: nginx:alpine
    container_name: sipenda
    restart: unless-stopped
    networks: [default, edge]
    volumes:
      # Hanya public/. Kode PHP dilayani dari image `app`, bukan bind mount —
      # Laravel butuh menulis ke storage/ dan bootstrap/cache/, dan cache
      # komponen Filament dibuat saat build image.
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      # Container ini duduk di dua network — beri tahu Traefik yang mana.
      traefik.docker.network: edge
      traefik.http.routers.sipenda.rule: Host(`sipenda.blataktech.com`)
      traefik.http.services.sipenda.loadbalancer.server.port: "80"
      traefik.http.routers.sipenda.middlewares: sec@docker,gzip@docker
    depends_on: [app]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    image: sipenda-php:latest
    container_name: sipenda-php
    restart: unless-stopped
    # Sengaja hanya di `default`: PHP-FPM tidak berurusan dengan Traefik.
    networks: [default]
    # .env.prod di-inject sebagai environment, BUKAN di-mount jadi .env.
    # Compose membacanya sebagai user pemilik berkas, jadi berkasnya boleh tetap
    # chmod 600 — php-fpm jalan sebagai www-data (uid 82) dan tidak akan pernah
    # bisa membaca berkas 600 milik uid 1000 kalau di-mount.
    # Laravel membaca env var asli; Dotenv immutable, jadi tidak ada yang menimpa.
    env_file: .env.prod
    volumes:
      # storage/ harus bisa ditulis dan tetap hidup melewati rebuild image.
      # Volume kosong di-seed dari isi image saat pertama kali dibuat.
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # mariadb:11 sudah ada di vm-gpu — tag ini menghindari pull ~330MB lagi.
    image: mariadb:11
    container_name: sipenda-db
    restart: unless-stopped
    networks: [default]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage:
  db-data:

networks:
  default:
  edge:
    external: true
