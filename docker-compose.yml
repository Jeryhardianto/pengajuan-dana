services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      # .env stays authoritative; real env vars win over it (Dotenv is immutable),
      # so only the host-vs-container difference is overridden here.
      DB_HOST: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - '8001:80'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
