server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Nama container, bukan nama service: nginx juga duduk di network `edge`
        # yang dipakai bersama stack lain di vm-gpu, dan `app` di sana resolve ke
        # banyak container milik stack lain. Nama container unik global.
        fastcgi_pass sipenda-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
